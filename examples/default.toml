game_teacher_labels = "data/test90/labels/bt4-it332"

[train]
batch_size = 1024    # positions per step; add grad_accum_steps if it doesn't fit in memory
steps = 500000
warmup_steps = 1000
lr = 5e-4
lr_boundaries = [400000, 466000]  # from these steps the learning rate is lr x lr_factors
lr_factors = [0.316, 0.1]
swa_start = 250000   # average the weights every swa_every steps from here; the average is the net
swa_every = 100
validate_every = 25000
validation_batches = 50
checkpoint_every = 25000
compile = true       # torch.compile: much faster steps, about a minute to start
