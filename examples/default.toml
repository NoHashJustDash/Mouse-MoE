# The default template: M2.1's network and its first training stage, in one file.
#
# Copy this file, change what you want, then (docs/2-getting-started.md):
#   python -I -m mouse_moe.download --config examples\my_net.toml
#   python -I -m mouse_moe.label_teacher --onnx bt4-it332-f16.onnx --config examples\my_net.toml --out data\test80\labels\bt4-it332
#   python -I -m mouse_moe.label_teacher --onnx bt4-it332-f16.onnx --config configs\m2\label_test90.toml --out data\test90\labels\bt4-it332
#   python -I -m mouse_moe.train --config examples\my_net.toml
#
# Unchanged, it is M2.1's first stage (configs/m2/m2.toml): about 23 hours on an RTX 5070.
# M2.1 then fine-tunes it on BT4 targets alone in two more stages (configs/m2/m2_stage2.toml
# and m2_stage3.toml); see docs/4-training.md. Sizes and what they cost: docs/5-scaling.md.
name = "default"

[model]
d_model = 320        # width of each square's token; divisible by heads, and by 8 for the engine
layers = 8           # encoder layers
heads = 10           # attention heads (32 wide each here)
ffn = "moe"          # "moe", or "dense" for an ordinary feed-forward block

[model.gab]          # attention bias generated from the whole board (Lc0's smolgen)
compress = 16        # values kept per square
hidden = 64          # size of the board summary
per_head = 64        # values per head, expanded to a 64 x 64 bias

[model.moe]
experts = 16         # routed experts per layer (the engine supports at most 16)
top_k = 2            # experts each square uses (the engine supports at most 4)
expert_hidden = 160  # hidden width of each expert
shared_hidden = 320  # hidden width of the shared expert every square uses (0: none)
routing = "token"    # each square picks its own experts (the only routing the engine runs)

[data]
# The 22 training hours of Lc0's test80 run (2024-04-01), about 182M positions. Hour 23:17
# is for validation and 22:17 is held out for testing; never train on either.
directory = "data/test80"
train_shards = [
    "training-run1-test80-20240401-0017.tar",
    "training-run1-test80-20240401-0117.tar",
    "training-run1-test80-20240401-0217.tar",
    "training-run1-test80-20240401-0317.tar",
    "training-run1-test80-20240401-0417.tar",
    "training-run1-test80-20240401-0517.tar",
    "training-run1-test80-20240401-0617.tar",
