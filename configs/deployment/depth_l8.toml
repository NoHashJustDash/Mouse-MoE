# Depth check at deployment width: 8 layers (about 1.1x T1 compute), short run.
name = "depth_l8"

[model]
d_model = 384
layers = 8
heads = 12
ffn = "moe"

[model.moe]
experts = 16
top_k = 2
expert_hidden = 192
shared_hidden = 384
routing = "token"

[data]
directory = "data/test80"
train_shards = [
    "training-run1-test80-20240401-0017.tar",
    "training-run1-test80-20240401-0117.tar",
    "training-run1-test80-20240401-0217.tar",
    "training-run1-test80-20240401-0317.tar",
    "training-run1-test80-20240401-0417.tar",
    "training-run1-test80-20240401-0517.tar",
    "training-run1-test80-20240401-0617.tar",
    "training-run1-test80-20240401-0717.tar",
    "training-run1-test80-20240401-0817.tar",
    "training-run1-test80-20240401-0917.tar",
    "training-run1-test80-20240401-1017.tar",
    "training-run1-test80-20240401-1117.tar",
    "training-run1-test80-20240401-1217.tar",
    "training-run1-test80-20240401-1317.tar",
    "training-run1-test80-20240401-1417.tar",
    "training-run1-test80-20240401-1517.tar",
    "training-run1-test80-20240401-1617.tar",
    "training-run1-test80-20240401-1717.tar",
    "training-run1-test80-20240401-1817.tar",
    "training-run1-test80-20240401-1917.tar",
    "training-run1-test80-20240401-2017.tar",
    "training-run1-test80-20240401-2117.tar",
]
validation_shards = ["training-run1-test80-20240401-2317.tar"]
test_shards = ["training-run1-test80-20240401-2217.tar"]
workers = 6
readers_per_worker = 4
shuffle_buffer = 300000
sample_rate = 0.5

[train]
batch_size = 1024
steps = 60000
warmup_steps = 1000
lr = 5e-4
lr_boundaries = [48000, 56000]
lr_factors = [0.316, 0.1]
swa_start = 30000
swa_every = 100
validate_every = 5000
validation_batches = 50
checkpoint_every = 5000