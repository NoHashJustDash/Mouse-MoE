# M2.0 stage 1: BT4 (it332) network labels for the 48 test90 hours M1.5 trained on
# with game targets only (configs/m20/m20.toml game_shards). Only mouse_moe.label_teacher
# reads this file; it labels [data] train_shards. The model and train sections are
# M1.5's stage 3, kept so the file loads as a run config; nothing trains from it.
name = "m2-label-test90"

[model]
d_model = 320
layers = 8
heads = 10

ffn = "moe"

[model.gab]
compress = 16
hidden = 64
per_head = 64

[model.moe]
experts = 16
top_k = 2
expert_hidden = 160
shared_hidden = 320
routing = "token"

[data]
directory = "data/test90"
train_shards = [
    "training-run3-test90-20251017-1817.tar",
    "training-run3-test90-20251018-0417.tar",
    "training-run3-test90-20251018-1417.tar",
    "training-run3-test90-20251019-0017.tar",
    "training-run3-test90-20251019-1017.tar",
    "training-run3-test90-20251019-2017.tar",
    "training-run3-test90-20251020-0617.tar",
    "training-run3-test90-20251020-1617.tar",
    "training-run3-test90-20251021-0217.tar",
    "training-run3-test90-20251021-1217.tar",
    "training-run3-test90-20251021-2217.tar",
    "training-run3-test90-20251022-0817.tar",
    "training-run3-test90-20251022-1817.tar",
    "training-run3-test90-20251023-0446.tar",
    "training-run3-test90-20251023-1449.tar",
    "training-run3-test90-20251023-2317.tar",
    "training-run3-test90-20251024-0917.tar",
    "training-run3-test90-20251024-1917.tar",
    "training-run3-test90-20251025-0517.tar",
    "training-run3-test90-20251025-1517.tar",
    "training-run3-test90-20251026-0117.tar",
    "training-run3-test90-20251026-1117.tar",
    "training-run3-test90-20251026-2117.tar",
    "training-run3-test90-20251027-0717.tar",
    "training-run3-test90-20251027-1717.tar",
    "training-run3-test90-20251028-0317.tar",
    "training-run3-test90-20251028-1317.tar",
    "training-run3-test90-20251028-2317.tar",
    "training-run3-test90-20251029-0917.tar",
    "training-run3-test90-20251029-1917.tar",
    "training-run3-test90-20251030-0517.tar",
    "training-run3-test90-20251030-1517.tar",
    "training-run3-test90-20251031-0117.tar",
    "training-run3-test90-20251031-1117.tar",
    "training-run3-test90-20251031-2117.tar",
    "training-run3-test90-20251101-0717.tar",
    "training-run3-test90-20251101-1717.tar",
    "training-run3-test90-20251102-0317.tar",
    "training-run3-test90-20251102-1317.tar",
    "training-run3-test90-20251102-2317.tar",
    "training-run3-test90-20251103-0917.tar",
    "training-run3-test90-20251103-1917.tar",
    "training-run3-test90-20251104-0517.tar",
    "training-run3-test90-20251104-1517.tar",
    "training-run3-test90-20251105-0117.tar",
