# M2.0 stage C: stage B's raw step-750k weights and optimizer state (--fork-from
# runs/m2-stage2/checkpoints/step_0750000.pt), trained on to step 900k with the same
# pure BT4 targets and data as stage B. The schedule repeats stage B's at 150k steps:
# re-warm from 5e-5 to 1.58e-4 over 2,000 steps, hold to 825k, then 5e-5 to 875k and
# 1.58e-5 to 900k, with SWA over 825k-900k. ~6.5 h. Runs in runs/m2-stage3.
name = "m2-stage3"
# Shape, measured with mouse_moe.benchmark on the RTX 5070 (2026-10-27, batch 1024):
# this one 6,216 positions/s (7.1 GiB, ~23 h for 500k steps); 16 x 128 top-4 over 10
# layers 1,276 (10.7 GiB, past the card's memory); 8 x 256 top-2 over 10 layers 4,976.

[model]
d_model = 320
layers = 8
heads = 10

ffn = "moe"

[model.gab]
compress = 16
hidden = 64
per_head = 64

[model.moe]
experts = 16
top_k = 2
expert_hidden = 160
shared_hidden = 320
routing = "token"

[data]
directory = "data/test80"
train_shards = [
    "training-run1-test80-20240401-0017.tar",
    "training-run1-test80-20240401-0117.tar",
