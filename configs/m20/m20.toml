# M20: M1's layout (16 experts, top-2, a shared expert, 8 layers) widened to ~20M
# parameters: 19.9M total, 8.4M active per square (42%), against M1's 13.2M and 5.85M.
# Trained once on the 22 Stage A test80 shards (182M positions, BT4 and game targets
# mixed) plus ~103M test90 positions on game targets only, with mirror augmentation and
# repeated openings down-sampled. M1 was -107.5 +/- 26 Elo against T1 at equal nodes
# (2026-10-27): the gap is network quality. Runs in runs/m20.
name = "m20"
# Shape, measured with mouse_moe.benchmark on the RTX 5070 (2026-10-27, batch 1024):
# this one 6,216 positions/s (7.1 GiB, ~23 h for 500k steps); 16 x 128 top-4 over 10
# layers 1,276 (10.7 GiB, past the card's memory); 8 x 256 top-2 over 10 layers 4,976.

[model]
d_model = 320
layers = 8
heads = 10

ffn = "moe"

[model.gab]
compress = 16
hidden = 64
per_head = 64

[model.moe]
experts = 16
top_k = 2
expert_hidden = 160
shared_hidden = 320
routing = "token"

[data]
directory = "data/test80"
train_shards = [
    "training-run1-test80-20240401-0017.tar",
    "training-run1-test80-20240401-0117.tar",
    "training-run1-test80-20240401-0217.tar",
    "training-run1-test80-20240401-0317.tar",
    "training-run1-test80-20240401-0417.tar",
    "training-run1-test80-20240401-0517.tar",
    "training-run1-test80-20240401-0617.tar",
