    "training-run1-test80-20240401-1917.tar",
    "training-run1-test80-20240401-2017.tar",
    "training-run1-test80-20240401-2117.tar",
]
validation_shards = ["training-run1-test80-20240401-2317.tar"]
test_shards = ["training-run1-test80-20240401-2217.tar"]
workers = 2
readers_per_worker = 4
shuffle_buffer = 300000
sample_rate = 0.5
teacher_labels = "data/test80/labels/bt4-it332"
# Targets: half BT4 (it332), half the games' own search policy and results.
teacher_weight = 0.5
teacher_temperature = 1.0
# Mirror castling-free positions at random; keep plies 0-9 at 40% (70% of them repeat).
mirror = true
opening_plies = 10
opening_keep = 0.4
# About 103M more positions trained on their games' own targets: 48 Lc0 test90 hours
# spread evenly over 2025-10-17 .. 2025-11-06 (every 10th file of that window; the last
# two hours, 2025-11-06 08:17 and 09:17, are held out). See docs/DATA.md.
game_directory = "data/test90"
game_shards = [
